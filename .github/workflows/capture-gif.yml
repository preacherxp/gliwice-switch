name: Capture full switch GIF
on:
  push:
    branches: [capture-full-switch]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install recording tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recording" playwright@1.56.1
          "$RUNNER_TEMP/recording/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record the actual WebGL switch
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/recording/node_modules" node capture-gif.cjs
          ffmpeg -y -framerate 12 -i capture/frames/%03d.png -filter_complex "[0:v]split[a][b];[a]palettegen=max_colors=224[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" -loop 0 capture/gliwice-day-night.gif
      - uses: actions/upload-artifact@v5
        with:
          name: gliwice-full-switch
          path: |
            capture/gliwice-day-night.gif
            capture/preview-day.png
            capture/preview-night.png
          retention-days: 7
